<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); }
  #term { position: absolute; inset: 4px 0 0 8px; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(128,128,128,.4); border-radius: 5px; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  // The host passes the starting theme in the query string (?theme=dark|light)
  // and sends a "theme" message whenever the app switches. xterm.js answers a
  // program's OSC 10, 11 and 4 colour queries from the theme in force, so a
  // program that asks after a switch hears the new colours.
  // The 16 ANSI colours are picked to read on each background; the 256-colour
  // cube and grey ramp stay xterm's, which is what programs expect of them.
  const ansi = (c) => ({
    black: c[0], red: c[1], green: c[2], yellow: c[3], blue: c[4], magenta: c[5], cyan: c[6], white: c[7],
    brightBlack: c[8], brightRed: c[9], brightGreen: c[10], brightYellow: c[11],
    brightBlue: c[12], brightMagenta: c[13], brightCyan: c[14], brightWhite: c[15]
  });
  const themes = {
    dark: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#d4d4d4', selectionBackground: '#264f78',
      ...ansi(['#000000', '#d64c3e', '#40be40', '#c4ba3c', '#5c80ff', '#cd5acd', '#40bccc', '#cccccc',
               '#808080', '#ff665c', '#60e260', '#f0e65a', '#82a0ff', '#f078f0', '#64e6f0', '#f0f0f0']) },
    light: { background: '#ffffff', foreground: '#1e1e1e', cursor: '#1e1e1e', selectionBackground: '#add6ff',
      ...ansi(['#000000', '#ba281e', '#188018', '#966e00', '#2440d2', '#a028a0', '#00788c', '#8c8c8c',
               '#606060', '#d6382c', '#249624', '#b08400', '#3c5cf0', '#be3cbe', '#008ea4', '#b8b8b8']) }
  };
  let dark = new URLSearchParams(location.search).get('theme') !== 'light';
  const theme = themes[dark ? 'dark' : 'light'];
  document.documentElement.style.setProperty('--bg', theme.background);

  const term = new Terminal({
    fontFamily: "'Cascadia Mono', 'Cascadia Code', Consolas, monospace",
    fontSize: 13,
    cursorBlink: true,
    scrollback: 50000,
    allowProposedApi: true,
    theme
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));

  const post = (m) => window.chrome.webview.postMessage(m);

  // Colour-scheme reports: CSI ? 996 n asks once, and a program that sets
  // DEC private mode 2031 is told CSI ? 997 ; 1 n (dark) or ; 2 n (light)
  // whenever the scheme changes. xterm.js knows neither, so they are handled
  // here and every other mode in the same sequence goes on to xterm.js.
  let reportScheme = false;
  const schemeReport = () => `\x1b[?997;${dark ? 1 : 2}n`;
  const hasMode = (params, mode) => params.some(p => p === mode || (Array.isArray(p) && p.includes(mode)));
  term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, params => { if (hasMode(params, 2031)) reportScheme = true; return false; });
  term.parser.registerCsiHandler({ prefix: '?', final: 'l' }, params => { if (hasMode(params, 2031)) reportScheme = false; return false; });
  term.parser.registerCsiHandler({ prefix: '?', final: 'n' }, params => {
    if (params.length !== 1 || params[0] !== 996) return false;
    post({ type: 'input', data: schemeReport() });
    return true;
  });
  const setTheme = isDark => {
    if (isDark === dark) return;
    dark = isDark;
    const next = themes[dark ? 'dark' : 'light'];
    term.options.theme = next;
    document.documentElement.style.setProperty('--bg', next.background);
    if (reportScheme) post({ type: 'input', data: schemeReport() });
  };
  const sendSize = () => {
    try { fit.fit(); } catch (e) { }
    post({ type: 'resize', cols: term.cols, rows: term.rows });
  };

  // The host sets the size from the app's text size; refit so the program
  // learns its new rows and columns.
  const setFont = size => {
    if (!size || term.options.fontSize === size) return;
    term.options.fontSize = size;
    sendSize();
  };

  document.getElementById('term').addEventListener('wheel', e => {
    if (!e.shiftKey) return;
    e.preventDefault(); e.stopPropagation();
    term.scrollLines(Math.sign(e.deltaY) * 3);
  }, { capture: true, passive: false });

  term.onData(data => post({ type: 'input', data }));
  // Panel chords (new, close, split, clear, select, cycle, full window) come
  // from the host as "ctrl shift alt:code" and go back to it; every other
  // key, plain Ctrl+D/W/K included, reaches the program.
  let chords = new Set();
  const chord = e => `${e.ctrlKey ? 1 : 0}${e.shiftKey ? 1 : 0}${e.altKey ? 1 : 0}:${e.code}`;
  // Ctrl+C copies when there is a selection; otherwise it reaches the program.
  term.attachCustomKeyEventHandler(e => {
    if (e.shiftKey && !e.ctrlKey && !e.altKey && e.code === 'Enter') {
      if (e.type === 'keydown') post({ type: 'input', data: '\n' });
      e.preventDefault(); return false;
    }
    if (e.shiftKey && !e.ctrlKey && !e.altKey && ['PageUp', 'PageDown', 'Home', 'End'].includes(e.code)) {
      if (e.type === 'keydown') {
        if (e.code === 'Home') term.scrollToTop();
        else if (e.code === 'End') term.scrollToBottom();
        else term.scrollPages(e.code === 'PageUp' ? -1 : 1);
      }
      e.preventDefault(); return false;
    }
    if (chords.has(chord(e))) {
      if (e.type === 'keydown') post({ type: 'key', code: e.code, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey });
      e.preventDefault();
      return false;
    }
    if (e.type === 'keydown' && e.ctrlKey && e.key === 'c' && term.hasSelection()) {
      navigator.clipboard.writeText(term.getSelection()); term.clearSelection(); return false;
    }
    if (e.type === 'keydown' && e.ctrlKey && e.key === 'v') {
      // term.paste brackets the text when the program asked for it, so a
      // multi-line paste reaches an agent as one block rather than line by line.
      navigator.clipboard.readText().then(t => term.paste(t)); return false;
    }
    // Ctrl+` belongs to the app: it toggles the panel.
    if (e.ctrlKey && e.key === '`') { if (e.type === 'keydown') post({ type: 'toggle' }); return false; }
    return true;
  });

  // The host pastes only into a program that has asked for bracketed
  // paste, so it is told whenever that mode turns on or off.
  let bracketedPaste = false;
  const reportModes = () => {
    const on = !!term.modes.bracketedPasteMode;
    if (on !== bracketedPaste) { bracketedPaste = on; post({ type: 'modes', bracketedPaste: on }); }
  };

  // Drops: a row dragged out of FleetMate goes to the host, which checks it
  // is that drag's own block and hands it over the way Send to Agent does.
  // Nothing dropped is ever typed here, so text or files dragged in from
  // another app neither reach the program nor navigate the page away.
  let agentDrag = false;
  const refuse = e => { e.preventDefault(); e.stopPropagation(); };
  window.addEventListener('dragenter', refuse, true);
  window.addEventListener('dragover', e => { refuse(e); e.dataTransfer.dropEffect = agentDrag ? 'copy' : 'none'; }, true);
  window.addEventListener('drop', e => {
    refuse(e);
    const text = e.dataTransfer.getData('text/plain');
    // Not gated on agentDrag: the host's "drag ended" can overtake the drop.
    if (text) post({ type: 'drop', text });
  }, true);

  window.chrome.webview.addEventListener('message', ev => {
    const m = ev.data;
    if (m.type === 'output') term.write(m.data, reportModes);
    else if (m.type === 'config') { chords = new Set(m.chords); setFont(m.fontSize); }
    else if (m.type === 'font') setFont(m.size);
    else if (m.type === 'theme') setTheme(!!m.dark);
    else if (m.type === 'clear') term.clear();
    else if (m.type === 'focus') term.focus();
    else if (m.type === 'agentDrag') agentDrag = !!m.active;
    else if (m.type === 'exit') term.write(`\r\n\x1b[90m[process exited with code ${m.code}]\x1b[0m\r\n`);
  });

  new ResizeObserver(sendSize).observe(document.getElementById('term'));
  post({ type: 'ready' });
  sendSize();
  // Focus is the host's call: a session started at launch must not take it.
</script>
</body>
</html>
