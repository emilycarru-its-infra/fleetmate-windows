name: ReportMate sync

# The Reporting tab is the ReportMate dashboard built from the ReportMate app's
# own source, kept here as the external/reportmate-app-csharp submodule. This
# keeps it on that repository's main branch: every hour it moves the submodule
# to main's newest commit, builds FleetMate against it -- the same gate ci.yml
# applies -- and when that passes, opens a pull request for the bump and merges it.
# A failing build leaves the pull request open with a comment, so a ReportMate
# change that breaks the tab is fixed on this side and never pushed back.
#
# Two jobs, because building runs ReportMate's code (its MSBuild targets can run
# anything). The build job has a read-only token that is not left in .git/config.
# The publish job holds the write token, never builds or runs ReportMate code,
# and records exactly the commit the build job tested.
#
# The build runs here rather than in ci.yml because a pull request opened with
# GITHUB_TOKEN does not start other workflows, so its checks would never report.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: reportmate-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SUBMODULE: external/reportmate-app-csharp

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      before: ${{ steps.bump.outputs.before }}
      after: ${{ steps.bump.outputs.after }}
      # Set by the runner, not by anything the build can write.
      result: ${{ steps.build.outcome }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Move ReportMate to its main branch
        id: bump
        shell: pwsh
        run: |
          $before = git -C $env:SUBMODULE rev-parse HEAD
          # Only ReportMate itself follows main. Its own submodule stays at the
          # commit ReportMate pins: --remote with --recursive would move that to
          # its main too, building a combination ReportMate never tested.
          git submodule update --remote --init $env:SUBMODULE
          if ($LASTEXITCODE -ne 0) { throw "submodule update failed" }
          git -C $env:SUBMODULE submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "nested submodule update failed" }
          $after = git -C $env:SUBMODULE rev-parse HEAD
          "before=$before" >> $env:GITHUB_OUTPUT
          "after=$after" >> $env:GITHUB_OUTPUT
          "changed=$(($before -ne $after).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "ReportMate $before -> $after"

      - name: Setup .NET
        if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Last step of the job, so nothing the build leaves behind runs after it.
      - name: Build
        id: build
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build FleetMate.sln --configuration Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    needs: build
    if: always() && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: chore/reportmate-sync
      BEFORE: ${{ needs.build.outputs.before }}
      AFTER: ${{ needs.build.outputs.after }}
      RESULT: ${{ needs.build.outputs.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # No submodules: this job only records a commit id, it never fetches the code.
      - uses: actions/checkout@v6

      - name: Record the tested ReportMate commit
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$BEFORE" "$AFTER"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit id: $sha"; exit 1; }
          done
          url=$(git config -f .gitmodules "submodule.$SUBMODULE.url")
          repo=${url#https://github.com/}; repo=${repo%.git}
          # Only a commit already on ReportMate's main branch is recorded.
          status=$(gh api "repos/$repo/compare/$AFTER...main" --jq .status)
          [[ "$status" == identical || "$status" == ahead ]] || { echo "$AFTER is not on $repo main ($status)"; exit 1; }
          short=${AFTER:0:7}
          {
            echo "Moves the Reporting tab to ReportMate \`$short\`."
            echo
            echo "Changes since \`${BEFORE:0:7}\`:"
            echo
            echo '```'
            gh api "repos/$repo/compare/$BEFORE...$AFTER" --jq '.commits[] | select(.parents | length == 1) | .sha[0:7] + " " + (.commit.message | split("\n")[0])' | head -30
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git update-index --cacheinfo "160000,$AFTER,$SUBMODULE"
          git commit -m "Move the Reporting tab to ReportMate $short"
          git push --force origin "$BRANCH"

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            number=$(gh pr create --base main --head "$BRANCH" \
              --title "Move the Reporting tab to the latest ReportMate" \
              --body-file "$RUNNER_TEMP/body.md" | sed 's#.*/##')
          fi

          if [[ "$RESULT" == success ]]; then
            gh pr merge "$number" --squash --delete-branch
          else
            gh pr comment "$number" --body "FleetMate does not build against ReportMate $short. See $RUN_URL. Fix it on the FleetMate side; this pull request stays open until then."
            exit 1
          fi
