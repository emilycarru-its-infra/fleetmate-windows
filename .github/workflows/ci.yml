name: CI

on:
  pull_request:
    branches: [main]
  # reportmate-sync starts this run on its branch, because a pull request it
  # opens with GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  TZ: 'America/Vancouver'

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # The Reporting tab builds from the ReportMate app's source, which
          # carries a submodule of its own.
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FleetMate.sln

      - name: Build
        run: dotnet build FleetMate.sln --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test FleetMate.Tests/FleetMate.Tests.csproj --configuration Release --no-build --verbosity minimal

      # TicketsMate is the GUI built as the Tickets-only edition. Build it too,
      # so a break in the edition fails here rather than at release time.
      - name: Build TicketsMate
        shell: pwsh
        run: |
          dotnet build FleetMate.GUI/FleetMate.GUI.csproj --configuration Release -p:Edition=TicketsMate --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem FleetMate.GUI/bin/TicketsMate -Recurse -Filter TicketsMate.exe | Select-Object -First 1
          if (-not $exe) { throw "TicketsMate.exe was not built" }
          Write-Host "Built $($exe.FullName)"

      # Package that build, so the TicketsMate installer is checked on every
      # pull request rather than first at release, including its Start Menu
      # shortcut and icon.
      - name: Build TicketsMate MSI
        shell: pwsh
        run: |
          $exe = Get-ChildItem FleetMate.GUI/bin/TicketsMate -Recurse -Filter TicketsMate.exe | Select-Object -First 1
          dotnet build TicketsMate.Installer/TicketsMate.Installer.wixproj --configuration Release -p:Platform=x64 -p:BinDir=$($exe.DirectoryName) --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = (Resolve-Path TicketsMate.Installer/bin/x64/Release/TicketsMate-x64.msi).Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT ``Name``, ``Directory_``, ``Icon_`` FROM ``Shortcut``"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          if (-not $record) { throw 'The TicketsMate MSI has no Start Menu shortcut' }
          $field = { param($i) $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, @($i)) }
          $name = & $field 1; $dir = & $field 2; $icon = & $field 3
          Write-Host "Shortcut: $name in $dir, icon $icon"
          if ($name -notlike '*TicketsMate' -or $dir -ne 'ProgramMenuFolder' -or $icon -ne 'TicketsMate.ico') { throw 'The TicketsMate shortcut is not as expected' }

  # A run started by workflow_dispatch (reportmate-sync does this for its pull
  # request) is not counted toward the pull request's required check, so this
  # job records the result as a commit status under the same name. It runs no
  # code from the repository, so the build above never holds this token.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record the result on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="Build and test" \
            -f target_url="$RUN_URL" -f description="workflow_dispatch run: $RESULT"
