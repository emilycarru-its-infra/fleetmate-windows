name: CI

on:
  pull_request:
    branches: [main]
  # reportmate-sync starts this run on its branch, because a pull request it
  # opens with GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  TZ: 'America/Vancouver'

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # The Reporting tab builds from the ReportMate app's source, which
          # carries a submodule of its own.
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FleetMate.sln

      - name: Build
        run: dotnet build FleetMate.sln --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test FleetMate.Tests/FleetMate.Tests.csproj --configuration Release --no-build --verbosity minimal

      # TicketsMate is the GUI built as the Tickets-only edition. Build it too,
      # so a break in the edition fails here rather than at release time.
      - name: Build TicketsMate
        shell: pwsh
        run: |
          dotnet build FleetMate.GUI/FleetMate.GUI.csproj --configuration Release -p:Edition=TicketsMate --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem FleetMate.GUI/bin/TicketsMate -Recurse -Filter TicketsMate.exe | Select-Object -First 1
          if (-not $exe) { throw "TicketsMate.exe was not built" }
          Write-Host "Built $($exe.FullName)"

  # A run started by workflow_dispatch (reportmate-sync does this for its pull
  # request) is not counted toward the pull request's required check, so this
  # job records the result as a commit status under the same name. It runs no
  # code from the repository, so the build above never holds this token.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record the result on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="Build and test" \
            -f target_url="$RUN_URL" -f description="workflow_dispatch run: $RESULT"
