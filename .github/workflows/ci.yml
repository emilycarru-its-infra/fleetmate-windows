name: CI

on:
  pull_request:
    branches: [main]
  # reportmate-sync starts this run on its branch, because a pull request it
  # opens with GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  TZ: 'America/Vancouver'

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # The Reporting tab builds from the ReportMate app's source, which
          # carries a submodule of its own.
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FleetMate.sln

      - name: Build
        run: dotnet build FleetMate.sln --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test FleetMate.Tests/FleetMate.Tests.csproj --configuration Release --no-build --verbosity minimal

      # TicketsMate is the GUI built as the Tickets-only edition. Build it too,
      # so a break in the edition fails here rather than at release time.
      - name: Build TicketsMate
        shell: pwsh
        run: |
          dotnet build FleetMate.GUI/FleetMate.GUI.csproj --configuration Release -p:Edition=TicketsMate --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem FleetMate.GUI/bin/TicketsMate -Recurse -Filter TicketsMate.exe | Select-Object -First 1
          if (-not $exe) { throw "TicketsMate.exe was not built" }
          Write-Host "Built $($exe.FullName)"

      # Package both products for both architectures and check the MSIs
      # themselves: the summary Template Windows Installer enforces, the product
      # name, the Start Menu shortcut (and TicketsMate's icon), and that each
      # payload's PE machine matches. An ARM64 MSI that still declared x64 got
      # through once because nothing read the built package.
      #
      # The payloads here are CI fixtures, never shipped: framework-dependent
      # builds for each runtime, packaged only so the installer's own metadata
      # can be read. Release packages come from build.ps1's published payloads.
      - name: Build and check MSIs (x64 and ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtures = Join-Path $env:RUNNER_TEMP 'msi-fixture'
          foreach ($arch in 'x64', 'arm64') {
            $rid = "win-$arch"
            dotnet build FleetMate.CLI/FleetMate.CLI.csproj --configuration Release -r $rid --self-contained false --verbosity minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build FleetMate.GUI/FleetMate.GUI.csproj --configuration Release -r $rid --self-contained false --verbosity minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build FleetMate.GUI/FleetMate.GUI.csproj --configuration Release -r $rid --self-contained false -p:Edition=TicketsMate --verbosity minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $find = { param($dir, $name) Get-ChildItem $dir -Recurse -Filter $name | Where-Object { $_.DirectoryName -like "*\$rid" } | Select-Object -First 1 }
            $cli = & $find FleetMate.CLI/bin/Release fleetmate.exe
            $gui = & $find FleetMate.GUI/bin/Release fleetmate-gui.exe
            $tickets = & $find FleetMate.GUI/bin/TicketsMate/Release TicketsMate.exe
            if (-not $cli -or -not $gui -or -not $tickets) { throw "A $rid payload was not built" }

            $stage = Join-Path $fixtures $arch
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item $cli.FullName, $gui.FullName $stage

            dotnet build FleetMate.Installer/FleetMate.Installer.wixproj --configuration Release -p:Platform=$arch -p:BinDir=$stage --verbosity minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./scripts/Test-MsiPackage.ps1 -Msi "FleetMate.Installer/bin/$arch/Release/FleetMate-$arch.msi" -Architecture $arch `
              -ProductName FleetMate -Shortcut FleetMate -Payload (Join-Path $stage fleetmate.exe), (Join-Path $stage fleetmate-gui.exe)

            dotnet build TicketsMate.Installer/TicketsMate.Installer.wixproj --configuration Release -p:Platform=$arch -p:BinDir=$($tickets.DirectoryName) --verbosity minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./scripts/Test-MsiPackage.ps1 -Msi "TicketsMate.Installer/bin/$arch/Release/TicketsMate-$arch.msi" -Architecture $arch `
              -ProductName TicketsMate -Shortcut TicketsMate -ShortcutIcon TicketsMate.ico -Payload $tickets.FullName
          }

  # A run started by workflow_dispatch (reportmate-sync does this for its pull
  # request) is not counted toward the pull request's required check, so this
  # job records the result as a commit status under the same name. It runs no
  # code from the repository, so the build above never holds this token.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record the result on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="Build and test" \
            -f target_url="$RUN_URL" -f description="workflow_dispatch run: $RESULT"
