name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        type: string
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  TZ: 'America/Vancouver'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          # The Reporting tab builds from the ReportMate app's source, which
          # carries a submodule of its own.
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^v',''
          if ($version -notmatch '^\d{4}\.\d{2}\.\d{2}\.\d{4}$') { throw "Tag $tag is not vYYYY.MM.DD.HHMM" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish CLI + GUI (unsigned)
        shell: pwsh
        run: .\build.ps1 -Publish -GUI -NoSign -BuildVersion '${{ steps.version.outputs.version }}'

      - name: Build .pkg packages
        shell: pwsh
        run: .\build.ps1 -PkgOnly -BuildVersion '${{ steps.version.outputs.version }}'

      - name: Build MSI packages (x64 + arm64)
        shell: pwsh
        # Unsigned MSIs land in release\FleetMate-<arch>-<version>.msi, and
        # TicketsMate's beside them as release\TicketsMate-<arch>-<version>.msi. The
        # deployment-pipeline pipeline fetches these, signs them with the
        # enterprise cert, repacks, and deploys as an Intune Win32 LOB.
        run: .\build.ps1 -MsiOnly -BuildVersion '${{ steps.version.outputs.version }}'

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          # build.ps1 -PkgOnly/-MsiOnly already drop .pkg/.msi into release/, so
          # only pull extras from build output dirs — NOT '.' (which contains
          # release/ and would copy those files onto themselves).
          foreach ($dir in @('publish', 'dist')) {
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -File -Include *.pkg,*.nupkg,*.msi -ErrorAction SilentlyContinue |
                Where-Object { $_.DirectoryName -notlike (Join-Path (Resolve-Path 'release') '*') } |
                ForEach-Object { Copy-Item $_.FullName "release/" -Force }
            }
          }
          # build.ps1 -MsiOnly publishes fleetmate.exe + fleetmate-gui.exe per
          # architecture into publish\msi-staging\<arch>. Zip those directly —
          # the directory name IS the arch, so nothing has to be inferred from a
          # runtime identifier (the old publish\cli / publish\gui layout carried
          # no RID in its path and always produced fleetmate-unknown.zip).
          foreach ($arch in @('x64', 'arm64')) {
            $staging = "publish/msi-staging/$arch"
            if (-not (Test-Path $staging)) { throw "MSI staging for $arch not found at $staging" }
            $files = Get-ChildItem $staging -File -Include fleetmate.exe,fleetmate-gui.exe -Recurse | ForEach-Object { $_.FullName }
            if ($files.Count -ne 2) { throw "Expected fleetmate.exe and fleetmate-gui.exe in $staging, found: $($files -join ', ')" }
            Compress-Archive -Path $files -DestinationPath "release/fleetmate-$arch.zip" -Force
          }
          # TicketsMate, the Tickets-only edition, ships as MSIs of its own.
          foreach ($arch in @('x64', 'arm64')) {
            if (-not (Get-ChildItem "release/TicketsMate-$arch-*.msi" -ErrorAction SilentlyContinue)) {
              throw "TicketsMate MSI for $arch not found in release/"
            }
          }
          Get-ChildItem release | Format-Table Name, Length

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = "FleetMate $tag"
          $dotnet = (dotnet --version).Trim()
          $os = (Get-CimInstance Win32_OperatingSystem).Caption.Trim()
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $buildInfo = @"
          ## Build info

          This release was built with .NET SDK $dotnet on $os, via a GitHub Actions workflow here: $runUrl. It is provided **unsigned** — see signing instructions at the bottom.
          "@

          $signing = @"
          ## Signing for enterprise deployment

          Sign the binaries with your organization's code signing certificate before distribution:

          ``````powershell
          `$cert = "Your Certificate Name"
          `$timestampUrl = "http://timestamp.digicert.com"

          Expand-Archive -Path fleetmate-x64.zip -DestinationPath .
          Get-ChildItem -Recurse -Include *.exe,*.dll | ForEach-Object {
              signtool sign /fd SHA256 /tr `$timestampUrl /td SHA256 /n `$cert `$_.FullName
          }
          ``````

          Built from the checked-out release tag.
          "@

          $sourceSha = (git rev-parse HEAD).Trim()
          $notes = "$buildInfo`n`nUnsigned CLI and desktop installers for x64 and ARM64.`n`nSource commit: $sourceSha.`n`n$signing"

          $artifacts = Get-ChildItem -Path release -File | ForEach-Object { $_.FullName }
          if ($artifacts.Count -eq 0) { throw 'No artifacts to upload' }
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw "Release $tag is already published; refusing to replace its assets" }
            gh release upload $tag @artifacts --clobber
          } else {
            gh release create $tag @artifacts --verify-tag --title $title --notes $notes
          }
          if ($LASTEXITCODE) { throw "Could not upload release assets for $tag" }
